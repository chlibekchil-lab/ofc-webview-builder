name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi yang muncul di HP'
        required: true
        default: 'App OFC'
      target_url:
        description: 'URL website yang mau dibungkus jadi APK'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Isi nama app & URL target
        run: |
          sed -i "s#{{APP_NAME}}#${{ github.event.inputs.app_name }}#g" app/src/main/res/values/strings.xml
          sed -i "s#{{TARGET_URL}}#${{ github.event.inputs.target_url }}#g" app/src/main/res/values/strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (debug)
        run: gradle assembleDebug

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
