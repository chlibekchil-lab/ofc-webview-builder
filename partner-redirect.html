<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menghubungkan...</title>
<style>
  body{background:#0b0f14; color:#eef2f7; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:20px;}
</style>
</head>
<body>
<div id="msg">🔄 Menghubungkan ke dashboard Partner...</div>
<script>
  fetch('dashboard-url.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.url){ throw new Error('Alamat belum tersedia'); }
      window.location.href = d.url + '/partner.html';
    })
    .catch(function(){
      document.getElementById('msg').textContent = '⚠️ Gagal memuat alamat dashboard. Pastikan bot lagi online, lalu coba refresh halaman ini.';
    });
</script>
</body>
</html>
